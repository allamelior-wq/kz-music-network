:root{--bg:#fbfaf7;--card:#ffffff;--ink:#1c1b19;--ink2:#5d5a54;--line:#e3dfd6;--edge:#a9a397;--rest:#cfcac0;--accent:#0b6e99;
  --c0:#0072B2;--c1:#D55E00;--c2:#009E73;--c3:#CC79A7;--c4:#E69F00;--c5:#56B4E9;
  --serif:Georgia,"Times New Roman",serif;--sans:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--card:#1f1f1c;--ink:#ecebe6;--ink2:#a5a299;--line:#35342f;--edge:#6b675e;--rest:#55524b;--accent:#5bb8e0;--c0:#3d9be0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161614;--card:#1f1f1c;--ink:#ecebe6;--ink2:#a5a299;--line:#35342f;--edge:#6b675e;--rest:#55524b;--accent:#5bb8e0;--c0:#3d9be0;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 var(--serif)}
main{max-width:1320px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h1{font-size:28px;line-height:1.2;margin:0;font-weight:600;text-wrap:balance}
h2{font-size:20px;margin:0;font-weight:600}
p{margin:0;max-width:75ch}
.lead{color:var(--ink2)}
.stats{display:flex;flex-wrap:wrap;gap:6px 30px;font:14px var(--sans);color:var(--ink2)}
.stats b{display:block;color:var(--ink);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font:14px var(--sans)}
.bar label{display:flex;gap:6px;align-items:center;color:var(--ink2)}
select,input{font:14px var(--sans);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{font:14px var(--sans);padding:6px 12px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;min-width:0}
#map{width:100%;height:min(78vh,820px);min-height:420px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;border-top:1px solid var(--line);font:13px var(--sans);color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;flex:none}
.legend .ln{width:22px;height:0;border-radius:0;border-top:solid var(--edge)}
#side{padding:14px 16px;font-size:15px;max-height:min(78vh,880px);overflow:auto}
#side .sub{color:var(--ink2);font:13px var(--sans);margin-top:2px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0;font:14px var(--sans)}
dt{color:var(--ink2)}dd{margin:0;font-variant-numeric:tabular-nums}
ul{margin:6px 0 0;padding-left:18px;font-size:14.5px}
li{cursor:pointer}li:hover{color:var(--accent)}
.top li{cursor:pointer}
.note{font:13px var(--sans);color:var(--ink2);max-width:90ch}
.lvhelp{font:14px var(--sans);color:var(--ink2);margin-top:-6px}
</style>
</head>
<body>
<main>
<header style="display:flex;flex-direction:column;gap:8px">

</div>
<p class="note" id="foot"></p>
</main>

    const k = col + '|' + w + '|' + op;
    (groups[k] = groups[k] || {x: [], y: [], col, w, op});
    groups[k].x.push(P(e[0])[0], P(e[1])[0], null); groups[k].y.push(P(e[0])[1], P(e[1])[1], null);
  });
  const tr = Object.values(groups).sort((a, b) => a.op - b.op).map(g => ({x: g.x, y: g.y, mode: 'lines', line: {color: g.col, width: g.w}, opacity: g.op, hoverinfo: 'skip', type: 'scatter'}));
  const mx = Math.max(...vis.map(i => N[i].degree));
  const order = vis.slice().sort((a, b) => N[a].degree - N[b].degree);
  tr.push({type: 'scatter', mode: 'markers', x: order.map(i => P(i)[0]), y: order.map(i => P(i)[1]), customdata: order,
    text: order.map(i => `<b>${N[i].label}</b><br>${HV.coauthors}: ${N[i].degree}<br>${HV.songs}: ${N[i].wdeg}`), hoverinfo: 'text',
    marker: {size: order.map(i => 5 + 26 * Math.sqrt(N[i].degree / mx)), color: order.map(i => colorOf(N[i])),
      opacity: order.map(i => sel === null || i === sel || nb.has(i) ? 0.95 : 0.25), line: {color: css('--card'), width: 1}}});
  const nlab = level === 'main' ? 30 : level === 'core' ? 25 : 20;
  const lab = sel === null ? vis.slice().sort((a, b) => N[b].degree - N[a].degree).slice(0, nlab)
                           : [sel, ...adj[sel].filter(a => on.has(a[0])).sort((a, b) => b[1] - a[1]).slice(0, 20).map(a => a[0])];
  tr.push({type: 'scatter', mode: 'text', x: lab.map(i => P(i)[0]), y: lab.map(i => P(i)[1]), text: lab.map(i => N[i].label),
    textposition: 'top center', textfont: {size: lab.map(i => i === sel ? 15 : 12), color: css('--ink'), family: 'Georgia, serif'}, hoverinfo: 'skip'});
  Plotly.react('map', tr, {margin: {l: 4, r: 4, t: 4, b: 4}, showlegend: false, paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    xaxis: {visible: false}, yaxis: {visible: false, scaleanchor: 'x'}, hovermode: 'closest', dragmode: 'pan',
    hoverlabel: {bgcolor: css('--card'), bordercolor: css('--line'), font: {color: css('--ink'), family: 'Georgia, serif'}}},
    {displayModeBar: true, displaylogo: false, modeBarButtonsToRemove: ['select2d', 'lasso2d', 'toImage'], responsive: true, scrollZoom: true});
  legend(vis);
}
function legend(vis){
  const c = D.colorings.find(c => c.key === colorBy), p = pal();
  const items = c.cats.map((t, i) => `<span><i style="background:${c.seq ? SEQ[i] : colorBy === 'comm' && i >= 6 ? css('--rest') : p[i]}"></i>${t}</span>`);
  if (c.none && vis.some(i => N[i][colorBy] < 0)) items.push(`<span><i style="background:${css('--rest')}"></i>${c.none}</span>`);
  items.push(`<span><i class="ln" style="border-top-width:1px"></i>${LN[0]}</span><span><i class="ln" style="border-top-width:2px"></i>${LN[1]}</span><span><i class="ln" style="border-top-width:3px"></i>${LN[2]}</span>`);
  document.getElementById('legend').innerHTML = items.join('');
}
function side(){
  const el = document.getElementById('side');
  if (sel === null){
    const vis = N.map((n, i) => i).filter(i => N[i].pos[level]).sort((a, b) => N[b].degree - N[a].degree).slice(0, 15);
    el.innerHTML = `<h2>${t('side.topTitle', 'Самые связанные')}</h2><p class="sub">${t('side.topHint', '')}</p>
      <ul class="top">${vis.map(i => `<li data-i="${i}">${N[i].label} — ${N[i].degree}</li>`).join('')}</ul>`;
  } else {
    const n = N[sel], co = adj[sel].slice().sort((a, b) => b[1] - a[1]);
    el.innerHTML = `<h2>${n.label}</h2><p class="sub"><a href="#" id="reset">${t('side.back', '← все артисты')}</a></p>
      <dl><dt>${t('side.coauthors', 'Соавторов')}</dt><dd>${n.degree}</dd><dt>${t('side.songs', 'Совместных песен')}</dt><dd>${n.wdeg}</dd>
      <dt>${t('side.broker', 'Посредничество')}</dt><dd>${(n.btw * 100).toFixed(2)}%</dd><dt>${t('side.community', 'Сообщество')}</dt><dd>${n.comm_name}</dd>
      <dt>${t('side.lyrics', 'Песен с текстами в базе')}</dt><dd>${n.songs}</dd></dl>
      <p class="sub">${t('side.listTitle', 'Соавторы — число общих песен')}</p>
      <ul>${co.map(a => `<li data-i="${a[0]}">${N[a[0]].label} — ${a[1]}</li>`).join('')}</ul>`;
    document.getElementById('reset').onclick = e => { e.preventDefault(); sel = null; draw(); side(); };
  }
  el.querySelectorAll('li').forEach(li => li.onclick = () => { sel = +li.dataset.i; if (!N[sel].pos[level]) setLevel('all'); draw(); side(); });
}
function setLevel(k){ level = k; lv.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k)); document.getElementById('lvhelp').textContent = D.levels.find(l => l.key === k).help; }
setLevel(level);
side();
if (window.Plotly){
  draw();
  document.getElementById('map').on('plotly_click', ev => {
    const p = ev.points.find(p => p.customdata !== undefined);
    if (p){ sel = sel === p.customdata ? null : p.customdata; draw(); side(); }
  });
} else {                                         // библиотека карты не загрузилась (нет интернета или сбой сети)
  const m = document.getElementById('map');
  m.style.cssText += ';display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink2);font:15px var(--sans)';
  m.textContent = t('loadError', 'Не удалось загрузить библиотеку для рисования карты. Проверьте подключение к интернету и обновите страницу.');
  window.draw = () => {};
}
lv.onclick = e => { const b = e.target.closest('button'); if (!b) return; setLevel(b.dataset.k); if (sel !== null && !N[sel].pos[level]) sel = null; draw(); side(); };
cs.onchange = () => { colorBy = cs.value; draw(); };
document.getElementById('q').onchange = e => { const i = N.findIndex(n => n.label === e.target.value); if (i >= 0){ sel = i; if (!N[i].pos[level]) setLevel('all'); draw(); side(); } };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
</script>
</body>
